<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Study Planner</title>
    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-graduation-cap"></i> Study Planner</h2>
                <!-- Close button for mobile view -->
                <button id="close-sidebar" class="mobile-only"><i class="fas fa-times"></i></button>
            </div>
            <nav class="sidebar-nav">
                <a href="#dashboard" class="nav-item active" data-target="dashboard-section"><i class="fas fa-chart-pie"></i> Dashboard</a>
                <a href="#tasks" class="nav-item" data-target="tasks-section"><i class="fas fa-tasks"></i> My Tasks</a>
                <a href="#timer" class="nav-item" data-target="timer-section"><i class="fas fa-clock"></i> Study Timer</a>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Top Header -->
            <header class="main-header">
                <!-- Hamburger menu for mobile -->
                <button id="open-sidebar" class="mobile-only"><i class="fas fa-bars"></i></button>
                
                <!-- Search bar -->
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-input" placeholder="Search tasks by title or description...">
                </div>
                
                <!-- Add Task Button -->
                <button id="btn-add-task-header" class="btn btn-primary"><i class="fas fa-plus"></i> <span>Add Task</span></button>
            </header>

            <div class="content-wrapper">
                <!-- ==================== DASHBOARD SECTION ==================== -->
                <section id="dashboard-section" class="section active">
                    <h2 class="section-title">Dashboard</h2>
                    
                    <!-- Statistics Cards -->
                    <div class="dashboard-cards">
                        <div class="card stat-card">
                            <div class="stat-icon" style="background: rgba(67, 24, 255, 0.1); color: var(--primary);">
                                <i class="fas fa-list"></i>
                            </div>
                            <div class="stat-details">
                                <p>Total Tasks</p>
                                <h3 id="stat-total">0</h3>
                            </div>
                        </div>
                        <div class="card stat-card">
                            <div class="stat-icon" style="background: rgba(5, 205, 153, 0.1); color: var(--success);">
                                <i class="fas fa-check-circle"></i>
                            </div>
                            <div class="stat-details">
                                <p>Completed</p>
                                <h3 id="stat-completed">0</h3>
                            </div>
                        </div>
                        <div class="card stat-card">
                            <div class="stat-icon" style="background: rgba(255, 206, 32, 0.1); color: var(--warning);">
                                <i class="fas fa-hourglass-half"></i>
                            </div>
                            <div class="stat-details">
                                <p>Pending</p>
                                <h3 id="stat-pending">0</h3>
                            </div>
                        </div>
                        <div class="card stat-card">
                            <div class="stat-icon" style="background: rgba(238, 93, 80, 0.1); color: var(--danger);">
                                <i class="fas fa-calendar-day"></i>
                            </div>
                            <div class="stat-details">
                                <p>Today's Tasks</p>
                                <h3 id="stat-today">0</h3>
                            </div>
                        </div>
                    </div>

                    <!-- Progress Bar -->
                    <div class="progress-section card mt-2">
                        <h3>Overall Task Progress</h3>
                        <div class="progress-container">
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" id="overall-progress-bar" style="width: 0%"></div>
                            </div>
                            <span id="overall-progress-text" class="progress-text">0% Completed</span>
                        </div>
                    </div>
                </section>

                <!-- ==================== TASKS SECTION ==================== -->
                <section id="tasks-section" class="section">
                    <div class="section-header">
                        <h2 class="section-title">My Tasks</h2>
                    </div>
                    
                    <!-- Filters -->
                    <div class="filters-container card">
                        <div class="filter-group">
                            <label for="filter-subject">Subject</label>
                            <select id="filter-subject">
                                <option value="all">All Subjects</option>
                                <!-- Subjects are added dynamically via JS -->
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="filter-priority">Priority</label>
                            <select id="filter-priority">
                                <option value="all">All Priorities</option>
                                <option value="High">High</option>
                                <option value="Medium">Medium</option>
                                <option value="Low">Low</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="filter-status">Status</label>
                            <select id="filter-status">
                                <option value="all">All Status</option>
                                <option value="pending">Pending</option>
                                <option value="completed">Completed</option>
                            </select>
                        </div>
                    </div>

                    <!-- Task List Container -->
                    <div class="task-list" id="task-list">
                        <!-- Task cards will be generated here by JS -->
                        <div class="empty-state">
                            <i class="fas fa-clipboard-list"></i>
                            <p>Loading tasks...</p>
                        </div>
                    </div>
                </section>

                <!-- ==================== STUDY TIMER SECTION ==================== -->
                <section id="timer-section" class="section">
                    <h2 class="section-title">Study Timer</h2>
                    <div class="timer-container card">
                        <div class="timer-display" id="timer-display">00:00:00</div>
                        <div class="timer-controls">
                            <button id="btn-timer-start" class="btn btn-primary"><i class="fas fa-play"></i> Start</button>
                            <button id="btn-timer-pause" class="btn btn-warning"><i class="fas fa-pause"></i> Pause</button>
                            <button id="btn-timer-reset" class="btn btn-outline"><i class="fas fa-stop"></i> Reset Session</button>
                        </div>
                        <div class="total-study-time">
                            <p>Total Logged Study Time: <strong id="total-time-display">0h 0m</strong></p>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- ==================== ADD/EDIT TASK MODAL ==================== -->
    <div id="task-modal" class="modal">
        <div class="modal-content card">
            <div class="modal-header">
                <h3 id="modal-title">Add New Task</h3>
                <button class="close-modal" id="close-modal">&times;</button>
            </div>
            <form id="task-form">
                <!-- Hidden input to store task ID when editing -->
                <input type="hidden" id="task-id">
                
                <div class="form-group">
                    <label for="task-title">Task Title *</label>
                    <input type="text" id="task-title" required placeholder="e.g., Complete Math Assignment">
                </div>
                
                <div class="form-row">
                    <div class="form-group half">
                        <label for="task-subject">Subject</label>
                        <!-- Datalist provides autocomplete based on existing subjects -->
                        <input type="text" id="task-subject" placeholder="e.g., Mathematics" list="subject-list">
                        <datalist id="subject-list"></datalist>
                    </div>
                    <div class="form-group half">
                        <label for="task-due-date">Due Date *</label>
                        <input type="date" id="task-due-date" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Priority</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="task-priority" value="Low">
                            <span class="custom-radio low">Low</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="task-priority" value="Medium" checked>
                            <span class="custom-radio medium">Medium</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="task-priority" value="High">
                            <span class="custom-radio high">High</span>
                        </label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="task-desc">Description (Optional)</label>
                    <textarea id="task-desc" rows="3" placeholder="Add details about the task..."></textarea>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn btn-outline" id="btn-cancel-modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Link to external JS file -->
    <script src="script.js"></script>
</body>
</html>
